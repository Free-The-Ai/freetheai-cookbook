site_name: FreeTheAI Cookbook
site_description: Runnable examples for the free, OpenAI-compatible FreeTheAI API - SDKs in Python, JavaScript, and Go, the OpenAI clients, curl, streaming, tool calling, web search, LangChain, LlamaIndex, the Vercel AI SDK, and RAG.
site_url: https://free-the-ai.github.io/freetheai-cookbook/
site_author: FreeTheAI
repo_url: https://github.com/Free-The-Ai/freetheai-cookbook
repo_name: Free-The-Ai/freetheai-cookbook
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 FreeTheAI. MIT licensed.

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Host Grotesk
    code: Azeret Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle: { icon: material/weather-sunny, name: Light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle: { icon: material/weather-night, name: Dark mode }
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Recipes: recipes.md
  - Apps and coding agents: apps.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Free-The-Ai
    - icon: fontawesome/brands/discord
      link: https://discord.gg/secrets
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/ImVibhek
    - icon: material/web
      link: https://freetheai.org
  generator: false
